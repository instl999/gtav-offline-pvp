[Match]
; 0 = Free-for-all, 1 = Team Deathmatch
Mode=0
; 0 = current location, 1-9 = presets (see in-game menu)
Arena=0
ArenaRadius=90
KillLimit=30
TimeLimitMinutes=10
RespawnDelaySeconds=3
; 0 Mixed, 1 Pistols, 2 SMGs, 3 Rifles, 4 Shotguns, 5 Snipers, 6 Explosives, 7 Melee
Loadout=0
GivePlayerLoadout=True
ReturnAfterMatch=True
ClearAmbient=True
; Weapon, health and armor pickups around the arena, respawning after a delay
Pickups=True
PickupRespawnSeconds=30
; Dying by your own hand or the world (falls, out of bounds) costs one kill, like Online
SuicidePenalty=True
; 0 Current, 1 Morning, 2 Noon, 3 Afternoon, 4 Evening, 5 Night (restored after the match)
TimeOfDay=0
; 0 Current, 1 Extra sunny, 2 Clear, 3 Cloudy, 4 Smog, 5 Foggy, 6 Overcast, 7 Rain, 8 Thunder,
; 9 Clearing, 10 Light snow, 11 Snow (Xmas), 12 Halloween (restored after the match)
Weather=0

[AI]
EnemyCount=8
AllyCount=3
; 0 Easy, 1 Normal, 2 Hard, 3 Elite
Difficulty=1
Accuracy=30
; % chance an enemy bot hunts you instead of its nearest target
PlayerBias=35

[HUD]
Blips=True
NameTags=True
HealthBars=True

[Keys]
Menu=F7
Scoreboard=Z
