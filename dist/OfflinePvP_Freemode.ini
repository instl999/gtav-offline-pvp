[Session]
; AI "Online" players in story mode. Toggle in-game with the interaction menu (M) > Online session.
Enabled=False
; 1-29 AI players (Online lobbies hold 30 including you)
Players=15
; 0 Off, 1 Low, 2 Normal, 3 High
Griefing=1
Accuracy=25
Bounties=True
; Respawn near where you died instead of at the hospital
OnlineRespawn=True
PlayersJoinAndLeave=True
; Freemode events (Checkpoints, Hot Property, King of the Castle): 0 Off, 1 every 10 min, 2 every 15, 3 every 20
EventFrequency=1
; Players invite you to jobs; accept with the AcceptInvite key or the interaction menu
JobInvites=True
; AI players get into fights with each other
PlayerFeuds=True
Blips=True
NameTags=True

[Keys]
InteractionMenu=M
PlayerList=Z
AcceptInvite=Y
