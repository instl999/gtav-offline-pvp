[Partners]
; AI crew mates who play alongside you in freemode (M > Crew & partners)
; How many come with you (1-4)
Count=2
; Call them in automatically when the game loads
CallOnStart=False
Accuracy=45
; False = partners can't be killed
CanDie=True
RespawnSeconds=20
Blips=True
NameTags=True
; Keep partners during story missions (they may get in the way)
DuringStoryMissions=False

[Keys]
; Optional hotkeys (None = menu only)
CrewMenu=None
OrderFollow=None
OrderAttack=None

; [Crew] holds your roster (Name|Rank|Model|Weapon|Kills|Deaths). It's written by the game; you get 3 crew mates on first run.
