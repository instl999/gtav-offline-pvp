name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch ScriptHookVDotNet 3.6.0 (reference only)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/scripthookvdotnet/scripthookvdotnet/releases/download/v3.6.0/ScriptHookVDotNet.zip -OutFile shvdn.zip
          Expand-Archive shvdn.zip -DestinationPath shvdn

      - name: Build with the in-box .NET Framework compiler
        shell: pwsh
        run: ./build.ps1 -ShvdnDll "$PWD/shvdn/ScriptHookVDotNet3.dll"

      - uses: actions/upload-artifact@v4
        with:
          name: OfflinePvP
          path: bin/
